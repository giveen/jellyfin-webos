<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jellyfin for webOS</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;
        background: #101010;
        color: #fff;
        overflow: hidden;
        height: 100vh;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 20px;
        gap: 32px;
      }
      .container.hidden { display: none; }
      #logo img { max-width: 300px; height: auto; }
      #serverInfoForm { width: 100%; max-width: 600px; }
      #serverInfoForm form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      #baseurl {
        width: 100%;
        padding: 14px 16px;
        font-size: 18px;
        border: 2px solid #333;
        border-radius: 6px;
        background: #1a1a1a;
        color: #fff;
        outline: none;
      }
      #baseurl:focus { border-color: #00a4dc; }
      .checkbox-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #aaa;
      }
      .checkbox-wrapper input { width: 20px; height: 20px; }
      #connect, #abort {
        padding: 14px 32px;
        font-size: 18px;
        border: none;
        border-radius: 6px;
        background: #00a4dc;
        color: #fff;
        cursor: pointer;
      }
      #connect:focus, #abort:focus { outline: 2px solid #fff; }
      #abort { background: #555; margin-top: 16px; }
      #busy {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      #busy h1 { font-size: 24px; font-weight: 400; }
      #error {
        color: #ff6b6b;
        font-size: 14px;
        margin-bottom: 8px;
        text-align: center;
      }
      iframe#contentFrame {
        display: none;
        width: 100%;
        height: 100vh;
        border: none;
        position: fixed;
        top: 0;
        left: 0;
      }
      [data-focusable]:focus { outline: 2px solid #00a4dc; }
    </style>
  <script type="module" crossorigin src="./assets/index-BcLp2XQu.js"></script>

  <body>
    <div id="app" class="container">
      <div id="logo">
        <img src="./assets/banner-dark.png" alt="Jellyfin" />
      </div>

      <div id="serverInfoForm">
        <p id="error" style="display: none; color: red;"></p>
        <form onsubmit="return false;">
          <input
            type="url"
            id="baseurl"
            name="baseurl"
            placeholder="http://jellyfin.local:8096"
            data-focusable
            autofocus
          />
          <div class="checkbox-wrapper">
            <input type="checkbox" id="auto_connect" name="auto_connect" data-focusable />
            <label for="auto_connect">Automatically connect on launch</label>
          </div>
          <button id="connect" type="button" data-focusable>Connect</button>
        </form>
      </div>

      <div id="busy" style="display: none;">
        <h1>Connecting...</h1>
        <button id="abort" type="button" data-focusable>Abort</button>
      </div>
    </div>

    <iframe id="contentFrame" style="display: none; width: 100%; height: 100vh; border: none;"></iframe>
  </body>
</html>
