<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jellyfin for webOS</title>
    <link rel="stylesheet" href="./assets/css/shell.css" />
  </head>
  <body>
    <div id="app" class="container">
      <div id="logo">
        <img src="./assets/banner-dark.png" alt="Jellyfin" />
      </div>

      <div id="serverInfoForm">
        <p id="error" class="hidden"></p>
        <form onsubmit="return false;">
          <input
            type="url"
            id="baseurl"
            name="baseurl"
            placeholder="http://jellyfin.local:8096"
            data-focusable
            autofocus
          />
          <div class="checkbox-wrapper">
            <input type="checkbox" id="auto_connect" name="auto_connect" data-focusable />
            <label for="auto_connect">Automatically connect on launch</label>
          </div>
          <button id="connect" type="button" data-focusable>Connect</button>
        </form>
      </div>

      <div id="serverList" class="hidden"></div>

      <div id="busy" class="hidden">
        <h1>Connecting...</h1>
        <button id="abort" type="button" data-focusable>Abort</button>
      </div>
    </div>

    <iframe id="contentFrame"></iframe>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
